<section id="faq" class="py-[clamp(3rem,8vh,6rem)] bg-white">
  <div class="mx-auto px-[clamp(1rem,5vw,3.5rem)] w-full max-w-7xl">
    <div class="text-center mb-[clamp(2rem,5vh,4rem)]">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-linear-to-br from-[#FF6B35] to-[#FDB813] mb-4">
        <svg lucideCircleQuestionMark class="w-7 h-7 text-white" />
      </div>
      <h2 class="font-extrabold text-gray-900 mb-4"
          style="font-size: clamp(1.75rem, 4vw + 0.25rem, 3rem);">
        Perguntas
        <span class="text-gradient"> Frequentes</span>
      </h2>
      <p class="text-gray-600 mx-auto max-w-2xl"
         style="font-size: clamp(1rem, 2vw + 0.5rem, 1.25rem);">
        Tire suas dúvidas antes de fazer seu investimento
      </p>
    </div>

    <div class="max-w-3xl mx-auto">
      <div class="space-y-3">
        @for (faq of faqs; track faq.question) {
          <div class="rounded-xl border border-gray-200 bg-white shadow-sm transition-colors hover:border-[#FF6B35]/30">
            <button
              (click)="toggleFaq($index)"
              class="w-full px-5 py-5 text-left flex items-center justify-between hover:no-underline"
            >
              <span class="font-bold text-gray-900 pr-4" style="font-size: clamp(0.875rem, 1.5vw + 0.25rem, 1.125rem);">
                {{ faq.question }}
              </span>
              <svg lucideChevronDown [class.rotate-180]="openFaqs().includes($index)" class="w-5 h-5 text-[#FF6B35] transition-transform shrink-0" />
            </button>
            @if (openFaqs().includes($index)) {
              <div class="px-5 pb-5 pt-1 text-gray-700 leading-relaxed"
                   style="font-size: clamp(0.875rem, 1.5vw, 1rem);">
                {{ faq.answer }}
              </div>
            }
          </div>
        }
      </div>
    </div>

    <!-- CTA adicional -->
    <div class="text-center mt-10">
      <div class="inline-block px-6 py-5 bg-linear-to-r from-[#FF6B35]/10 to-[#FDB813]/10 rounded-xl border border-[#FF6B35]/20">
        <p class="text-gray-700 mb-1" style="font-size: clamp(0.875rem, 1.5vw, 1rem);">
          Ainda tem dúvidas?
        </p>
        <a
          [href]="'mailto:' + config.email"
          class="text-[#FF6B35] font-bold hover:text-[#FF8555] transition-colors underline"
          style="font-size: clamp(0.875rem, 1.5vw, 1rem);"
        >
          Entre em contato conosco
        </a>
      </div>
    </div>
  </div>
</section>
