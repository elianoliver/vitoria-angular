<header class="fixed top-4 z-50 w-full">
  <div class="flex justify-center px-4">
    <div class="container max-w-7xl bg-white/90 backdrop-blur shadow-md rounded-4xl">
      <div class="flex items-center justify-between px-6 py-3">

        <!-- LOGO -->
        <a class="flex items-center gap-3" href="#hero">
          <img
            src="/logo.svg"
            alt="Logo Do Tabuleiro ao Mercado"
            class="h-13 w-auto"
            draggable="false"
          />
          <span class="hidden sm:block text-sm font-bold text-gray-900 leading-tight">
            Do<br> Tabuleiro<br> Ao Mercado
          </span>
        </a>

        <!-- NAV -->
        <nav class="hidden lg:flex items-center gap-8">
          @for (item of menuItems; track item.href) {
            <a
              [href]="item.href"
              (click)="handleNavClick($event, item.href)"
              class="text-lg text-gray-700 font-medium hover:text-[#FF6B35] transition-colors"
            >
              {{ item.label }}
            </a>
          }
        </nav>

        <!-- DESKTOP CTA -->
        <a
          href="#comprar"
          class="hidden lg:inline-flex items-center justify-center h-10 px-5 rounded-lg cursor-pointer font-semibold transition-all duration-300 bg-linear-to-r from-[#FF6B35] to-[#FDB813] hover:from-[#FF8555] hover:to-[#FDCA33] text-white shadow-lg hover:shadow-xl hover:scale-105 text-sm gap-2"
        >
          <svg lucideShoppingCart class="w-4 h-4" />
          Comprar Agora
        </a>

        <!-- MOBILE MENU BUTTON -->
        <button
          (click)="toggleMobileMenu()"
          class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors"
          [attr.aria-expanded]="mobileMenuOpen()"
        >
          @if (mobileMenuOpen()) {
            <svg lucideX class="w-5 h-5" />
          } @else {
            <svg lucideMenu class="w-5 h-5" />
          }
        </button>
      </div>

      <!-- Mobile Menu -->
      @if (mobileMenuOpen()) {
        <nav class="border-t border-gray-100 lg:hidden">
          @for (item of menuItems; track item.href) {
            <a
              [href]="item.href"
              (click)="handleNavClick($event, item.href)"
              class="block px-6 py-3 text-center text-sm text-gray-700 hover:bg-gray-50 font-medium transition-colors"
            >
              {{ item.label }}
            </a>
          }
        </nav>
      }
    </div>
  </div>
</header>
